name: Build Android Debug APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Ensure persistent signing keystore
        run: |
          if [ ! -f "android/keystore/app.keystore" ]; then
            mkdir -p android/keystore
            keytool -genkeypair -v \
              -keystore android/keystore/app.keystore \
              -alias win10sim \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass win10sim123 \
              -keypass win10sim123 \
              -dname "CN=Win10 Simulator"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/keystore/app.keystore
            git commit -m "chore(android): add persistent app signing keystore [skip ci]"
            git pull --rebase || true
            git push
          else
            echo "Reusing existing android/keystore/app.keystore"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Prepare named APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Win10Simulator.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: win10-simulator-debug-apk
          path: Win10Simulator.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TITLE="Win10 Simulator v1.0.${{ github.run_number }} (Build ${{ github.run_number }})"
          RELEASE_NOTES=$(printf "versionCode: %s\nversionName: 1.0.%s\n\nDownload **Win10Simulator.apk** to install or update in place without uninstalling." "${{ github.run_number }}" "${{ github.run_number }}")
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Win10Simulator.apk --clobber
            gh release edit latest --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES" --latest
          else
            gh release create latest Win10Simulator.apk --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES" --latest
          fi
